<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Quest: Goblin Grove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#12213a; --panel:#1c3156; --ink:#f4f1ff; --gold:#ffcc4d; --good:#4ade80; --bad:#fb7185; --accent:#8b5cf6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Fredoka, system-ui, sans-serif; background:radial-gradient(circle at 50% 0%, #24406e 0%, var(--bg) 60%); color:var(--ink); min-height:100vh; }
  header { text-align:center; padding:14px 16px 4px; }
  h1 { margin:0; font-size:clamp(24px,5vw,40px); color:var(--gold); letter-spacing:.5px; text-shadow:0 3px 0 #7a5a00; }
  .sub { opacity:.75; font-size:14px; }
  main { max-width:960px; margin:0 auto; padding:12px 16px 40px; }
  .screen { display:none; } .screen.on { display:block; }
  .card { background:var(--panel); border-radius:20px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  label { display:block; font-weight:600; margin:8px 0 4px; }
  input[type=text] { width:100%; font:inherit; font-size:22px; padding:10px 14px; border-radius:14px; border:3px solid #33507f; background:#0f1b30; color:var(--ink); }
  .heroes { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:12px 0; }
  .hero { cursor:pointer; border:4px solid transparent; border-radius:18px; overflow:hidden; background:#0f1b30; text-align:center; transition:transform .15s; }
  .hero:hover { transform:translateY(-3px); } .hero.sel { border-color:var(--gold); }
  .hero img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .hero .n { padding:6px; font-weight:700; } .hero .t { font-size:12px; opacity:.7; padding-bottom:6px; }
  .btn { font:inherit; font-size:20px; font-weight:700; padding:12px 26px; border:0; border-radius:16px; cursor:pointer; background:var(--gold); color:#3a2a00; box-shadow:0 5px 0 #b38a1d; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b38a1d; } .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:#33507f; color:var(--ink); box-shadow:0 5px 0 #1f3355; }
  .arena { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:end; }
  .fighter { text-align:center; } .fighter img { width:100%; max-width:300px; aspect-ratio:1; object-fit:cover; border-radius:18px; background:#0f1b30; transition:transform .3s; }
  .fighter .name { font-weight:700; margin-top:6px; font-size:18px; }
  .dizzy img { transform:rotate(-8deg) scale(.95); filter:saturate(.6); }
  .bubble { background:#fff; color:#222; border-radius:16px; padding:10px 14px; margin:10px 0; position:relative; font-size:17px; }
  .bubble.dm { background:#e9e3ff; } .bubble .who { font-weight:700; color:var(--accent); margin-right:6px; }
  .problem { text-align:center; font-size:clamp(40px,9vw,72px); font-weight:700; margin:8px 0; color:var(--gold); text-shadow:0 4px 0 #6b4d00; }
  .answerRow { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .answerRow input { max-width:220px; text-align:center; font-size:32px; }
  .pad { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; max-width:520px; margin:12px auto 0; }
  .pad button { font:inherit; font-size:24px; font-weight:700; padding:12px 0; border:0; border-radius:12px; background:#33507f; color:var(--ink); cursor:pointer; box-shadow:0 4px 0 #1f3355; }
  .pad button:active { transform:translateY(3px); box-shadow:none; }
  .status { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; font-size:15px; }
  .ladder { display:flex; gap:6px; } .rung { width:34px; height:12px; border-radius:6px; background:#33507f; } .rung.lit { background:var(--good); }
  .feedback { text-align:center; font-size:24px; font-weight:700; min-height:32px; margin-top:8px; }
  .good { color:var(--good); } .bad { color:var(--bad); }
  .hint { text-align:center; opacity:.85; margin-top:6px; min-height:22px; }
  .foot { text-align:center; font-size:12px; opacity:.55; margin-top:18px; }
  @media (max-width:560px) { .arena { grid-template-columns:1fr 1fr; } .pad { grid-template-columns:repeat(4,1fr); } }
</style>
</head>
<body>
<header><h1>Math Quest: Goblin Grove</h1><div class="sub">Every monster guards a math riddle. Solve it to pass!</div></header>
<main>
  <section id="pick" class="screen on card">
    <label for="kid">What's your name, hero?</label>
    <input id="kid" type="text" maxlength="20" placeholder="Type your name" autocomplete="off">
    <label>Choose your hero</label>
    <div class="heroes" id="heroes"></div>
    <div style="text-align:center"><button class="btn" id="startBtn" disabled>Enter the Grove!</button></div>
  </section>

  <section id="play" class="screen">
    <div class="status">
      <div>⭐ Streak: <b id="streak">0</b></div>
      <div>Level <b id="bandNum">1</b>: <span id="bandName"></span></div>
      <div class="ladder" id="ladder"></div>
      <div>🏆 <b id="wins">0</b> solved</div>
    </div>
    <div class="card">
      <div class="arena">
        <div class="fighter" id="heroBox"><img id="heroImg" alt=""><div class="name" id="heroName"></div></div>
        <div class="fighter" id="monBox"><img id="monImg" alt=""><div class="name" id="monName"></div></div>
      </div>
      <div class="bubble dm"><span class="who">DM</span><span id="dmText"></span></div>
      <div class="bubble"><span class="who" id="monWho"></span><span id="monText"></span></div>
      <div class="problem" id="problem"></div>
      <div class="answerRow">
        <input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="?">
        <button class="btn" id="goBtn">Go!</button>
        <button class="btn ghost" id="hintBtn">Hint</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="hint" id="hint"></div>
      <div class="pad" id="pad"></div>
    </div>
    <div class="foot">DM: NVIDIA Nemotron on Nebius Token Factory · Art: generated · Banksy AI LLC</div>
  </section>
</main>
<script>
const HEROES = [
  { id:"nova",   name:"Nova",   tag:"Star Sorceress" },
  { id:"ember",  name:"Ember",  tag:"Fire Knight" },
  { id:"kai",    name:"Kai",    tag:"Tide Ranger" },
  { id:"willow", name:"Willow", tag:"Forest Guardian" },
];
const MON_NAMES = { gloomfang:"the Gloomfang", king:"the Goblin King", wyrmling:"Wyrmling" };
const $ = (id) => document.getElementById(id);
const state = { kid:"", hero:null, enc:null, wins:0, hintUsed:false };

// --- hero picker ---
for (const h of HEROES) {
  const el = document.createElement("div"); el.className = "hero"; el.dataset.id = h.id;
  el.innerHTML = `<img src="/heroes/${h.id}_idle.webp" alt="${h.name}"><div class="n">${h.name}</div><div class="t">${h.tag}</div>`;
  el.onclick = () => { state.hero = h; document.querySelectorAll(".hero").forEach(x => x.classList.toggle("sel", x === el)); gate(); };
  $("heroes").appendChild(el);
}
$("kid").oninput = gate;
function gate() { state.kid = $("kid").value.trim(); $("startBtn").disabled = !(state.kid && state.hero); }
try { const last = JSON.parse(localStorage.getItem("mq") || "null"); if (last) { $("kid").value = last.kid; document.querySelector(`.hero[data-id="${last.hero}"]`)?.click(); gate(); } } catch {}

// --- number pad ---
for (const k of ["1","2","3","4","5","6","7","8","9","0","/","⌫"]) {
  const b = document.createElement("button"); b.textContent = k;
  b.onclick = () => { const a = $("answer"); a.value = k === "⌫" ? a.value.slice(0,-1) : a.value + k; a.focus(); };
  $("pad").appendChild(b);
}

async function api(path, body) {
  const r = await fetch(path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`${path} ${r.status}`);
  return r.json();
}

const say = (id, text) => { $(id).textContent = ""; let i = 0; const t = setInterval(() => { $(id).textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(t); }, 14); };
const speak = (text) => { try { if (!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.pitch = 1.1; speechSynthesis.speak(u); } catch {} };
const monName = (id) => MON_NAMES[id] || id[0].toUpperCase() + id.slice(1);

function render(profile, enc) {
  state.enc = enc; state.hintUsed = false;
  $("streak").textContent = profile.streak; $("wins").textContent = state.wins;
  $("bandNum").textContent = profile.band; $("bandName").textContent = enc.bandName;
  $("ladder").innerHTML = [1,2,3,4,5].map(b => `<div class="rung ${b <= profile.band ? "lit" : ""}"></div>`).join("");
  $("heroImg").src = `/heroes/${state.hero.id}_idle.webp`; $("heroName").textContent = state.hero.name;
  $("monBox").classList.remove("dizzy");
  $("monImg").src = `/monsters/${enc.monster}_idle.webp`; $("monName").textContent = monName(enc.monster);
  $("monWho").textContent = monName(enc.monster);
  say("dmText", enc.dm.narration); setTimeout(() => say("monText", enc.dm.monster_line), 400);
  speak(`${enc.dm.narration} ${enc.dm.monster_line}`);
  $("problem").textContent = enc.text + " = ?";
  $("answer").value = ""; $("feedback").textContent = ""; $("hint").textContent = ""; $("goBtn").disabled = false;
  $("answer").focus();
}

$("startBtn").onclick = async () => {
  $("startBtn").disabled = true; $("startBtn").textContent = "Opening the gate…";
  try {
    localStorage.setItem("mq", JSON.stringify({ kid: state.kid, hero: state.hero.id }));
    const { profile, encounter } = await api("/api/start", { kid: state.kid, hero: state.hero.id });
    $("pick").classList.remove("on"); $("play").classList.add("on");
    render(profile, encounter);
  } catch (e) { alert("The grove is closed right now: " + e.message); }
  $("startBtn").disabled = false; $("startBtn").textContent = "Enter the Grove!";
};

$("hintBtn").onclick = () => { state.hintUsed = true; $("hint").textContent = `💡 ${state.enc.hint}`; speak(state.enc.dm.hint_line || state.enc.hint); };

async function submit() {
  const ans = $("answer").value.trim(); if (!ans || !state.enc) return;
  $("goBtn").disabled = true;
  const enc = state.enc;
  try {
    const res = await api("/api/answer", { kid: state.kid, band: enc.band, seed: enc.seed, monster: enc.monster, answer: ans });
    if (res.correct) {
      state.wins++;
      $("monImg").src = `/monsters/${enc.monster}_dizzy.webp`; $("monBox").classList.add("dizzy");
      $("heroImg").src = `/heroes/${state.hero.id}_cast.webp`;
      $("feedback").innerHTML = `<span class="good">✨ Correct! ${monName(enc.monster)} is dizzy!</span>`;
      speak("Correct!");
    } else {
      $("monImg").src = `/monsters/${enc.monster}_surprised.webp`;
      $("feedback").innerHTML = `<span class="bad">Not quite — ${enc.text} = ${res.answer}. Next one!</span>`;
      speak(`Not quite. ${enc.text.replace("×","times").replace("÷","divided by")} equals ${res.answer}.`);
    }
    setTimeout(() => render(res.profile, res.encounter), res.correct ? 1800 : 2600);
  } catch (e) { $("feedback").textContent = "Hmm, the grove hiccuped. Try again."; $("goBtn").disabled = false; }
}
$("goBtn").onclick = submit;
$("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
</script>
</body>
</html>
