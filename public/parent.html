<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Quest — Parent View</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#12213a; --panel:#1c3156; --ink:#f4f1ff; --gold:#ffcc4d; --good:#4ade80; --bad:#fb7185; --dim:#33507f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Fredoka, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:20px 16px 50px; }
  h1 { color:var(--gold); margin:0 0 4px; font-size:28px; } .sub { opacity:.7; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  input { font:inherit; font-size:18px; padding:8px 12px; border-radius:12px; border:2px solid var(--dim); background:#0f1b30; color:var(--ink); }
  button { font:inherit; font-size:18px; font-weight:700; padding:8px 18px; border:0; border-radius:12px; background:var(--gold); color:#3a2a00; cursor:pointer; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--panel); border-radius:16px; padding:14px; }
  .card .k { font-size:13px; opacity:.7; } .card .v { font-size:30px; font-weight:700; color:var(--gold); }
  h2 { font-size:18px; margin:18px 0 8px; }
  .bars { display:flex; flex-direction:column; gap:6px; }
  .bar { display:grid; grid-template-columns:110px 1fr 40px; align-items:center; gap:8px; font-size:15px; }
  .bar .fill { height:16px; border-radius:8px; background:var(--bad); }
  .strip { display:flex; gap:3px; flex-wrap:wrap; } .dot { width:14px; height:14px; border-radius:4px; background:var(--dim); }
  .dot.ok { background:var(--good); } .dot.no { background:var(--bad); }
  .ladder { display:flex; gap:4px; align-items:flex-end; height:80px; } .ladder div { flex:1; background:var(--gold); border-radius:4px 4px 0 0; min-width:4px; opacity:.85; }
  .muted { opacity:.6; font-size:14px; } a { color:var(--gold); }
</style>
</head>
<body>
<main>
  <h1>Parent View</h1>
  <div class="sub">What the Grove remembers about your hero — the adaptive engine's memory, in plain sight.</div>
  <div class="row"><input id="kid" placeholder="Hero's name" autocomplete="off"><button id="go">Show</button><a href="/" style="align-self:center">← back to the game</a></div>
  <div id="out" class="muted">Enter the name your child used in the game.</div>
</main>
<script>
const BANDS = { 1:"Counting & Addition", 2:"Subtraction", 3:"Multiplication", 4:"Division", 5:"Fractions" };
const FAMILY = (f) => {
  const m = f.match(/^([+\-x/]|frac\/)(\d+)$/); if (!m) return f;
  return { "+":`adding ${m[2]}`, "-":`taking away ${m[2]}`, "x":`${m[2]} times table`, "/":`dividing by ${m[2]}`, "frac/":`fractions in ${m[2]}ths` }[m[1]];
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

async function show() {
  const kid = $("kid").value.trim(); if (!kid) return;
  location.hash = kid;
  const p = await (await fetch(`/api/profile?kid=${encodeURIComponent(kid)}`)).json();
  if (!p.total) { $("out").innerHTML = `<div class="muted">No adventures yet for <b>${esc(kid)}</b>. Go play a round!</div>`; return; }
  const acc = Math.round(100 * p.correctTotal / p.total);
  const weak = Object.entries(p.weak || {}).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxW = weak[0]?.[1] || 1;
  const hist = p.history || [];
  const days = new Set(hist.map(h => new Date(h.t).toDateString())).size;
  $("out").innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Current level</div><div class="v">${p.band}</div><div class="muted">${BANDS[p.band]}</div></div>
      <div class="card"><div class="k">Problems solved</div><div class="v">${p.correctTotal}</div><div class="muted">of ${p.total} tried (${acc}%)</div></div>
      <div class="card"><div class="k">Current streak</div><div class="v">${p.streak}</div><div class="muted">3 in a row levels up</div></div>
      <div class="card"><div class="k">Days played</div><div class="v">${days || 1}</div><div class="muted">hero: ${esc(p.hero || "—")}</div></div>
    </div>
    <h2>Needs practice</h2>
    ${weak.length ? `<div class="bars">${weak.map(([f, n]) => `<div class="bar"><span>${esc(FAMILY(f))}</span><div class="fill" style="width:${Math.round(100*n/maxW)}%"></div><span>${n} miss${n>1?"es":""}</span></div>`).join("")}</div>`
                  : `<div class="muted">No misses recorded yet — nice.</div>`}
    <h2>Level over the last ${hist.length} problems</h2>
    <div class="ladder">${hist.map(h => `<div style="height:${h.band*20}%" title="Level ${h.band}"></div>`).join("")}</div>
    <h2>Right / wrong, oldest → newest</h2>
    <div class="strip">${hist.map(h => `<div class="dot ${h.ok ? "ok" : "no"}" title="${esc(FAMILY(h.family))} — ${h.ok ? "right" : "wrong"}"></div>`).join("")}</div>
    <p class="muted">The Dungeon Master (NVIDIA Nemotron on Nebius) narrates; this memory lives in the game's own store and decides which monsters — and which math — your hero meets next.</p>`;
}
$("go").onclick = show; $("kid").addEventListener("keydown", (e) => { if (e.key === "Enter") show(); });
if (location.hash.length > 1) { $("kid").value = decodeURIComponent(location.hash.slice(1)); show(); }
</script>
</body>
</html>
